<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>lyra store</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#fdeaa0;--l:#e4defa;--p:#f6b3cf;--g:#c4ebd3;--pd:#c02a78;--gd:#1f7a55;--ink:#4b2a45;--mu:#85687c;--bg:#fffafd;--card:#fff;--ln:#ecc3d8;--side:#eee9fc}
@media(prefers-color-scheme:dark){:root{--y:#4a3f16;--l:#2f2750;--p:#5a2b46;--g:#1f4535;--pd:#ff8ec2;--gd:#6fd8a4;--ink:#f6e3ef;--mu:#c0a2b6;--bg:#1d1623;--card:#271d2e;--ln:#5a3b56;--side:#241c33}}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--pd);outline-offset:2px}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
aside{background:var(--side);padding:18px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:17px;padding:4px 8px 14px}
.nb{display:flex;gap:10px;align-items:center;background:none;border:0;border-radius:14px;padding:10px 12px;font-weight:600;color:var(--mu);text-align:left;width:100%}
.nb.on{background:var(--p);color:#4b2a45}
#lockbtn{margin-top:auto}
main{padding:22px 20px 40px;background-image:radial-gradient(var(--ln) 1px,transparent 1px);background-size:18px 18px}
.mb{display:none;font-weight:800;margin-bottom:6px}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
h1{margin:0;font-size:24px;font-weight:800;flex:1}
.btn{background:var(--p);color:#4b2a45;border:0;border-radius:999px;padding:10px 18px;font-weight:700}
.btn.o{background:var(--card);border:1.5px solid var(--pd);color:var(--pd)}
.btn.g{background:var(--g);color:var(--gd)}
.btn.s{padding:7px 13px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.st{border:1.5px dashed var(--ln);border-radius:18px;padding:14px;background:var(--card)}
.st small{color:var(--mu);font-weight:600}.st b{display:block;font-size:24px;margin-top:4px}
.st:nth-child(4n+1){background:var(--y)}.st:nth-child(4n+2){background:var(--l)}.st:nth-child(4n+3){background:var(--p)}.st:nth-child(4n){background:var(--g)}
h2{font-size:17px;margin:18px 0 10px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.oc{border:1.5px dashed var(--ln);border-radius:20px;padding:14px;background:var(--card)}
.r1{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:17px}
.r2{color:var(--mu);margin:2px 0 10px;font-size:14px}
.dt{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px;color:var(--mu)}.dt b{color:var(--ink);font-size:14px}.dt span:last-child{grid-column:1/-1;font-weight:700;color:var(--pd)}
.nt{margin:8px 0 0;font-size:13px;color:var(--mu)}
.bt{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.act{background:var(--g);color:var(--gd)}.chip.soon{background:var(--y);color:var(--ink)}.chip.today{background:var(--p);color:#4b2a45}.chip.exp{background:var(--l);color:var(--mu)}
.fb{display:flex;gap:10px;margin-bottom:14px}.fb>*{flex:1;min-width:0}
.f{background:var(--card);border:1.5px solid var(--ln);border-radius:14px;padding:10px 12px;width:100%}
.empty{text-align:center;color:var(--mu);border:1.5px dashed var(--ln);border-radius:20px;padding:36px 14px;background:var(--card)}
.ov{position:fixed;inset:0;background:rgba(40,20,40,.5);display:grid;place-items:center;padding:14px;z-index:20;overflow:auto}
.ov[hidden]{display:none}
.box{background:var(--card);border-radius:24px;padding:20px;width:100%;max-width:440px}
.box h2{margin:0 0 12px}.box label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hi{border-bottom:1px dashed var(--ln);padding:9px 0;font-size:14px}.hi small{color:var(--mu);display:block}
.panel{background:var(--card);border:1.5px dashed var(--ln);border-radius:20px;padding:16px;margin-bottom:14px}.panel h2{margin-top:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}.toast.on{opacity:1}
@media(max-width:760px){
.app{display:block}
aside{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5;border-top:2px solid var(--ln);gap:2px}
.brand,#lockbtn{display:none}.mb{display:block}
.nb{flex-direction:column;gap:1px;padding:6px 2px;font-size:10.5px;justify-content:center;text-align:center;flex:1;min-width:0}
main{padding:calc(14px + env(safe-area-inset-top,0px)) 14px 100px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside><div class="brand">🍀 lyra store</div><div id="nav" style="display:contents"></div><button class="nb" id="lockbtn" hidden>🔒 Kunci ulang</button></aside>
  <main><div class="mb">🍀 lyra store</div><header><h1 id="ttl"></h1><button class="btn" id="add">+ Tambah Order</button></header><section id="v"></section></main>
</div>

<div class="ov" id="md" hidden><div class="box">
  <h2 id="mt">Tambah Order</h2>
  <label for="f-app">Nama aplikasi</label><input class="f" id="f-app" list="apps" placeholder="Netflix, Canva, ..."><datalist id="apps"></datalist>
  <div class="g2"><div><label for="f-ord">Tanggal order</label><input class="f" type="date" id="f-ord"></div>
  <div><label for="f-dur">Durasi</label><select class="f" id="f-dur"><option value="7">7 hari</option><option value="14">14 hari</option><option value="30" selected>30 hari</option><option value="60">60 hari</option><option value="90">90 hari</option><option value="180">180 hari</option><option value="365">365 hari</option></select></div></div>
  <label for="f-ren">Tanggal renew</label><input class="f" type="date" id="f-ren">
  <div class="g2"><div><label for="f-cus">Customer</label><input class="f" id="f-cus" placeholder="Nama"></div><div><label for="f-ph">No. WhatsApp</label><input class="f" id="f-ph" inputmode="tel" placeholder="08xx"></div></div>
  <label for="f-pr">Harga (Rp)</label><input class="f" id="f-pr" inputmode="numeric" placeholder="0">
  <label for="f-nt">Catatan</label><input class="f" id="f-nt" placeholder="Opsional">
  <div class="bt" style="margin-top:16px"><button class="btn" id="save">Simpan</button><button class="btn o" id="cancel">Batal</button></div>
</div></div>

<div class="ov" id="lock" hidden><div class="box" style="text-align:center"><h2>🔒 lyra store</h2><input class="f" id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off"><p id="pe" style="color:var(--pd);min-height:20px;margin:8px 0"></p><button class="btn" id="unlock">Buka</button></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const T=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/864e5);
const fmt=s=>s?new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-';
const rp=n=>'Rp'+(+n||0).toLocaleString('id-ID');
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Penyimpanan browser tidak bisa dipakai')}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)};
const DEFTPL='Halo kak {nama}, langganan {aplikasi} kakak akan berakhir pada {renew}. Mau lanjut perpanjang? Kabari aku ya ♡';
const APPS=['Netflix','Canva','CapCut','Spotify','ChatGPT','YouTube Premium','Prime Video','Vidio','Disney+','Viu','WeTV','iQIYI','Loklok','HBO Max','Alight Motion','Zoom'];
const NAV=[['dash','🏠','Dashboard'],['rek','📋','Rekapan'],['rem','🔔','Reminder'],['riw','🕘','Riwayat'],['cus','👥','Customer'],['set','⚙️','Settings']];
const LB={act:'Aktif',soon:'Segera renew',today:'Renew hari ini',exp:'Expired'};
let O=ld('lyra_o',[]),H=ld('lyra_h',[]),C=ld('lyra_c',{tpl:DEFTPL,pin:''}),V='dash',F={q:'',app:''},editId=null;
const save=()=>{sv('lyra_o',O);sv('lyra_h',H);sv('lyra_c',C)};
const log=m=>{H.unshift({t:Date.now(),m});H=H.slice(0,200)};
const st=o=>{const d=diff(o.renew,T());return d<0?'exp':d===0?'today':d<=7?'soon':'act'};
const msg=o=>(C.tpl||DEFTPL).replace(/{nama}/g,o.cust||'kak').replace(/{aplikasi}/g,o.app).replace(/{renew}/g,fmt(o.renew));
const wa=o=>{let p=(o.phone||'').replace(/\D/g,'');if(p.startsWith('0'))p='62'+p.slice(1);return 'https://wa.me/'+p+'?text='+encodeURIComponent(msg(o))};

function card(o,btns){
  const d=diff(o.renew,T()),s=st(o);
  return `<article class="oc" data-id="${o.id}"><div class="r1"><b>${esc(o.app)}</b><span class="chip ${s}">${LB[s]}</span></div>
  <div class="r2">${esc(o.cust||'Tanpa nama')}${o.price?' · '+rp(o.price):''}</div>
  <div class="dt"><span>Tanggal order<br><b>${fmt(o.order)}</b></span><span>Tanggal renew<br><b>${fmt(o.renew)}</b></span>
  <span>${d<0?Math.abs(d)+' hari lewat':d===0?'Renew hari ini':d+' hari lagi'}</span></div>
  ${o.note?`<p class="nt">${esc(o.note)}</p>`:''}<div class="bt">${btns}</div></article>`;
}
const editBtns='<button class="btn o s" data-a="edit">Ubah</button><button class="btn o s" data-a="del">Hapus</button>';
const remBtns=o=>`<button class="btn s" data-a="copy">Salin pesan</button>${o.phone?`<a class="btn g s" style="text-decoration:none" target="_blank" rel="noopener" href="${wa(o)}">WhatsApp</a>`:''}<button class="btn o s" data-a="renew">Perpanjang +${o.dur||30}h</button>`;
const empty=(t,b)=>`<div class="empty">${t}${b?`<br><br><button class="btn" data-a="new">Buat order pertama</button>`:''}</div>`;

const VIEWS={
dash(){
  const c=k=>O.filter(o=>st(o)===k).length,cu=new Set(O.map(o=>(o.cust||'').trim().toLowerCase()).filter(Boolean)).size;
  const S=[['Total Order',O.length],['Order Aktif',O.length-c('exp')],['Renewal Hari Ini',c('today')],['Segera Renewal',c('soon')],['Order Expired',c('exp')],['Customer Unik',cu],['Total Nilai',rp(O.reduce((a,o)=>a+(+o.price||0),0))]];
  const att=O.filter(o=>st(o)!=='act').sort((a,b)=>a.renew<b.renew?-1:1).slice(0,6);
  return `<div class="stats">${S.map(x=>`<div class="st"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div>`+
    (O.length?`<h2>Perlu perhatian</h2>${att.length?`<div class="list">${att.map(o=>card(o,remBtns(o))).join('')}</div>`:empty('Semua order aman ♡')}`:empty('your little order book is empty ♡',1));
},
rek(){
  const apps=[...new Set(O.map(o=>o.app))].sort(),q=F.q.toLowerCase();
  const L=O.filter(o=>(!F.app||o.app===F.app)&&(!q||(o.app+' '+(o.cust||'')+' '+(o.note||'')).toLowerCase().includes(q))).sort((a,b)=>a.renew<b.renew?-1:1);
  return `<div class="fb"><input class="f" id="q" type="search" placeholder="Cari aplikasi, customer" value="${esc(F.q)}"><select class="f" id="fa"><option value="">Semua aplikasi</option>${apps.map(a=>`<option ${F.app===a?'selected':''}>${esc(a)}</option>`).join('')}</select></div>`+
    (L.length?`<div class="list">${L.map(o=>card(o,editBtns)).join('')}</div>`:empty(O.length?'Tidak ada order yang cocok.':'Belum ada order.',!O.length));
},
rem(){
  const L=O.filter(o=>st(o)!=='act').sort((a,b)=>a.renew<b.renew?-1:1);
  return L.length?`<div class="list">${L.map(o=>card(o,remBtns(o))).join('')}</div>`:empty('Tidak ada yang perlu diingatkan ♡');
},
riw(){return H.length?`<div class="panel">${H.map(h=>`<div class="hi">${esc(h.m)}<small>${new Date(h.t).toLocaleString('id-ID')}</small></div>`).join('')}</div>`:empty('Belum ada riwayat.')},
cus(){
  const m={};O.forEach(o=>{const k=(o.cust||'Tanpa nama').trim().toLowerCase();(m[k]=m[k]||{n:o.cust||'Tanpa nama',ph:o.phone,o:[]}).o.push(o);if(o.phone)m[k].ph=o.phone});
  const L=Object.values(m).sort((a,b)=>b.o.length-a.o.length);
  return L.length?`<div class="list">${L.map(c=>`<article class="oc"><div class="r1"><b>${esc(c.n)}</b><span class="chip act">${c.o.length} order</span></div><div class="r2">${esc(c.ph||'Tanpa kontak')}</div><div class="dt"><span>Aktif<br><b>${c.o.filter(o=>st(o)!=='exp').length}</b></span><span>Total nilai<br><b>${rp(c.o.reduce((a,o)=>a+(+o.price||0),0))}</b></span><span>${esc([...new Set(c.o.map(o=>o.app))].join(', '))}</span></div></article>`).join('')}</div>`:empty('Belum ada customer.');
},
set(){return `<div class="panel"><h2>Template reminder</h2><p class="nt">Pakai {nama}, {aplikasi}, {renew}.</p><textarea class="f" id="tpl" rows="3">${esc(C.tpl)}</textarea></div>
<div class="panel"><h2>PIN kunci</h2><p class="nt">Kunci ringan agar orang lain di HP-mu tidak langsung melihat data. Bukan keamanan penuh.</p><input class="f" id="np" type="password" inputmode="numeric" placeholder="PIN baru (4-8 angka)"><div class="bt"><button class="btn s" data-a="pin">Simpan PIN</button>${C.pin?'<button class="btn o s" data-a="nopin">Hapus PIN</button><button class="btn g s" data-a="lock">Kunci sekarang</button>':''}</div></div>
<div class="panel"><h2>Cadangan data</h2><p class="nt">Data tersimpan hanya di browser ini. Ekspor berkala sebagai cadangan, dan impor untuk memindahkan ke perangkat lain.</p><div class="bt"><button class="btn s" data-a="exp">Ekspor JSON</button><button class="btn o s" data-a="imp">Impor JSON</button><button class="btn o s" data-a="reset">Hapus semua data</button></div><input type="file" id="file" accept="application/json" hidden></div>`}
};
function render(){
  $('#nav').innerHTML=NAV.map(n=>`<button class="nb ${V===n[0]?'on':''}" data-v="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join('');
  $('#ttl').textContent=NAV.find(n=>n[0]===V)[2]+(V==='dash'?' 🌷':'');
  $('#v').innerHTML=VIEWS[V]();
  $('#lockbtn').hidden=!C.pin;
  $('#apps').innerHTML=[...new Set([...APPS,...O.map(o=>o.app)])].map(a=>`<option value="${esc(a)}">`).join('');
}
function openForm(o){
  editId=o?o.id:null;$('#mt').textContent=o?'Ubah Order':'Tambah Order';
  $('#f-app').value=o?o.app:'';$('#f-ord').value=o?o.order:T();$('#f-dur').value=o?String(o.dur||30):'30';
  $('#f-ren').value=o?o.renew:addDays(T(),30);$('#f-cus').value=o?o.cust||'':'';$('#f-ph').value=o?o.phone||'':'';
  $('#f-pr').value=o?o.price||'':'';$('#f-nt').value=o?o.note||'':'';$('#md').hidden=false;$('#f-app').focus();
}
const calc=()=>{const o=$('#f-ord').value;if(o)$('#f-ren').value=addDays(o,+$('#f-dur').value)};
$('#f-ord').onchange=calc;$('#f-dur').onchange=calc;
$('#add').onclick=()=>openForm();$('#cancel').onclick=()=>$('#md').hidden=true;
$('#save').onclick=()=>{
  const app=$('#f-app').value.trim(),ord=$('#f-ord').value,ren=$('#f-ren').value;
  if(!app||!ord||!ren)return toast('Isi aplikasi, tanggal order, dan tanggal renew');
  const d={app,order:ord,renew:ren,dur:+$('#f-dur').value,cust:$('#f-cus').value.trim(),phone:$('#f-ph').value.trim(),price:+($('#f-pr').value.replace(/\D/g,''))||0,note:$('#f-nt').value.trim()};
  if(editId){Object.assign(O.find(o=>o.id===editId),d);log('Ubah order '+app+' ('+(d.cust||'-')+')')}
  else{O.push({id:Date.now().toString(36),...d});log('Order baru '+app+' ('+(d.cust||'-')+')')}
  save();$('#md').hidden=true;render();toast('Tersimpan');
};
$('#nav').onclick=e=>{const b=e.target.closest('[data-v]');if(b){V=b.dataset.v;render();window.scrollTo(0,0)}};
$('#v').oninput=e=>{if(e.target.id==='q'){F.q=e.target.value;const p=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}};
$('#v').onchange=e=>{if(e.target.id==='fa'){F.app=e.target.value;render()}if(e.target.id==='tpl'){C.tpl=e.target.value;save();toast('Template tersimpan')}if(e.target.id==='file'){const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);if(!Array.isArray(j.o))throw 0;if(!confirm('Ganti semua data dengan isi file ini?'))return;O=j.o;H=j.h||[];if(j.tpl)C.tpl=j.tpl;save();render();toast('Impor berhasil')}catch(x){toast('File tidak valid')}})}};
$('#v').onclick=async e=>{
  const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a,card=a.closest('.oc'),o=card&&O.find(x=>x.id===card.dataset.id);
  if(k==='new')openForm();
  else if(k==='edit')openForm(o);
  else if(k==='del'){if(confirm('Hapus order '+o.app+'?')){O=O.filter(x=>x!==o);log('Hapus order '+o.app+' ('+(o.cust||'-')+')');save();render()}}
  else if(k==='copy'){try{await navigator.clipboard.writeText(msg(o));toast('Pesan disalin')}catch(x){toast('Gagal menyalin')}}
  else if(k==='renew'){const b=o.renew>=T()?o.renew:T();o.renew=addDays(b,o.dur||30);log('Perpanjang '+o.app+' ('+(o.cust||'-')+') sampai '+fmt(o.renew));save();render();toast('Diperpanjang')}
  else if(k==='pin'){const p=$('#np').value.trim();if(!/^\d{4,8}$/.test(p))return toast('PIN 4-8 angka');C.pin=await hash(p);save();render();toast('PIN disimpan')}
  else if(k==='nopin'){C.pin='';save();render()}
  else if(k==='lock'){try{sessionStorage.removeItem('lyra_u')}catch(x){}showLock()}
  else if(k==='exp'){const b=new Blob([JSON.stringify({o:O,h:H,tpl:C.tpl})],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='lyra-store-backup.json';l.click();setTimeout(()=>URL.revokeObjectURL(l.href),1e3)}
  else if(k==='imp')$('#file').click();
  else if(k==='reset'){if(confirm('Hapus SEMUA order dan riwayat? Tidak bisa dibatalkan.')){O=[];H=[];save();render();toast('Data dihapus')}}
};
async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('lyra'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa('lyra'+p)}}
function showLock(){$('#lock').hidden=false;$('#pin').value='';$('#pe').textContent='';$('#pin').focus()}
$('#unlock').onclick=async()=>{if(await hash($('#pin').value)===C.pin){try{sessionStorage.setItem('lyra_u','1')}catch(x){}$('#lock').hidden=true}else $('#pe').textContent='PIN salah'};
$('#pin').onkeydown=e=>{if(e.key==='Enter')$('#unlock').click()};
$('#lockbtn').onclick=()=>{try{sessionStorage.removeItem('lyra_u')}catch(x){}showLock()};
render();
try{if(C.pin&&sessionStorage.getItem('lyra_u')!=='1')showLock()}catch(e){if(C.pin)showLock()}
</script>
</body>
</html>
